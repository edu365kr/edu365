<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 확인용</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;background:#e7edf3;font:14px/1.5 sans-serif}
#wrap{position:relative;overflow:hidden;background:#fff;margin:10px auto;box-shadow:0 6px 24px rgba(8,39,70,.18)}
#f{position:absolute;left:0;border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="/book" width="1200" height="900" title="확인용 화면"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
const wrap = document.getElementById('wrap');
const w = q.get('w') || 1200, h = q.get('h') || 900, top = q.get('top') || 0;
f.width = w; f.height = q.get('fh') || h;
if (q.get('u')) f.src = q.get('u');
wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
wrap.style.marginTop = (q.get('mt') || 10) + 'px';
f.style.top = (-top) + 'px';
</script>
</body>
</html>
