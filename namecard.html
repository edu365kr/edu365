<style>
:root{

.chip{

.zoom-hint{

}
.zoom-hint svg{width:13px;height:13px;flex:none}

.share-btn::after{

footer{

/* 확대 보기 */
.lightbox{

body.no-scroll{overflow:hidden}
.lightbox .close{

  width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);

/* 토스트 */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));

}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:560px){

}
@media (prefers-reduced-motion:reduce){
  .toast{transition:none}
}

<script>
(function(){
  var SHARE_URL = "https://edu365.kr/namecard";
  var SHARE_TITLE = "김범일 명함";
  var btn = document.getElementById("share-card");
  var toastEl = document.getElementById("toast");
  var note = document.getElementById("share-note");
  var timer = null;

  function showToast(msg){
    if (!toastEl) { return; }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
  }

  function copyLink(){
    function done(){ showToast("명함 주소를 복사했습니다. 붙여넣기 해 주세요."); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(SHARE_URL).then(done, legacyCopy);
      return;
    }
    legacyCopy();
  }

  function legacyCopy(){
    var ok = false;
    try {
      var ta = document.createElement("textarea");
      ta.value = SHARE_URL;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, SHARE_URL.length);
      ok = document.execCommand && document.execCommand("copy");
      document.body.removeChild(ta);
    } catch(e){ ok = false; }
    showToast(ok ? "명함 주소를 복사했습니다. 붙여넣기 해 주세요." : ("명함 주소: " + SHARE_URL));
  }

  if (btn) {
    btn.addEventListener("click", function(){
      var payload = { title: SHARE_TITLE, text: "김범일 명함 — 폭력예방(중심) · 청렴 · 인권", url: SHARE_URL };
      if (typeof navigator.share === "function") {
        try {
          var p = navigator.share(payload);
          if (p && typeof p.then === "function") {
            p.then(function(){
              if (note) { note.textContent = "공유 창을 열었습니다"; }
            }, function(err){
              if (err && err.name === "AbortError") { return; }
              copyLink();
            });
          }
          return;
        } catch(e) {
          if (e && e.name === "AbortError") { return; }
        }
      }
      copyLink();
    });
  }

  var lb = document.getElementById("lightbox");
  var open = document.getElementById("open-card");
  var close = document.getElementById("close-lightbox");
  function openBox(){
    if (!lb) { return; }
    lb.classList.add("open");
    lb.setAttribute("aria-hidden","false");
    document.body.classList.add("no-scroll");
  }
  function closeBox(){
    if (!lb) { return; }
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden","true");
    document.body.classList.remove("no-scroll");
  }
  if (open) { open.addEventListener("click", openBox); }
  if (lb) {
    lb.addEventListener("click", function(e){
      if (e.target === lb) { closeBox(); }
    });
  }
  if (close) {
    close.addEventListener("click", function(){ closeBox(); });
  }
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") { closeBox(); } });
})();
</script>
